name: Deploy Vue App to GitHub Pages
permissions:
  contents: write

on:
  push:
    branches:
      - main   # ou master selon ton repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # npm ci installe exactement ce que décrit package-lock.json et
        # échoue si le lock a divergé. npm install pouvait résoudre des
        # versions non verrouillées au moment du déploiement.
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

